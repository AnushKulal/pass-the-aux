name: Apply database migrations

# Schema changes land by pushing a migration file — no local Supabase CLI, no
# stored login, no particular machine. This is what makes the project workable
# from a cloud session, a phone, or a fresh laptop.
#
# THE LIMIT THAT MATTERS: there is one database. A migration that reaches `main`
# reaches production, because production is the only environment. `db push` runs
# each migration in a transaction, so a failure rolls that file back — but a
# migration that succeeds and is *wrong* (a dropped column, a widened policy) is
# not undone by anything here. Use the dry run when you are unsure.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would apply, without applying it
        type: boolean
        default: false

# Never two migrations at once, and never cancel one midway — a cancelled push
# can leave the migration history disagreeing with the schema.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # regenerated types are committed back

    env:
      SUPABASE_PROJECT_REF: atdusjfidswqrkuefgvr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      # Fail loudly and early. Without this the CLI reports a confusing auth
      # error three steps later, which reads like a broken migration.
      - name: Check secrets are present
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set. Add it under Settings > Secrets and variables > Actions."
            missing=1
          fi
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Parse with libpg_query before touching the database, so a typo costs a
      # 20-second job rather than a half-applied schema.
      - name: Parse every migration
        run: node scripts/check-sql.mjs supabase/migrations

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Apply
        if: ${{ !inputs.dry_run }}
        run: supabase db push --linked

      - name: Dry run only — nothing was applied
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run. The list above shows what a real run would apply."

      # Types are part of the schema contract, so they travel with it. The
      # helper preserves the hand-written alias block that the app imports.
      - name: Regenerate types
        if: ${{ !inputs.dry_run }}
        run: node scripts/gen-types.mjs

      - name: Commit types if they changed
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- src/lib/database.types.ts; then
            echo "Types already match the schema."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/database.types.ts
          git commit -m "chore(db): regenerate types after migration"
          git push
