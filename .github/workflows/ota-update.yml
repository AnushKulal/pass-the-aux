name: Ship OTA update

# Pushes a JavaScript-only update straight to installed apps — no rebuild, no
# reinstall. Users pick it up on next launch.
#
# THE LIMIT THAT MATTERS: app.json sets runtimeVersion policy "appVersion", so an
# update only reaches builds whose version matches (currently 1.0.0). Anything
# that changes native code — a new package with native modules, a permission, an
# app.json plugin, or a version bump — needs a fresh APK from android-apk.yml.
# OTA moves JS and assets. It cannot move native code.
on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed
        required: true
        type: string
      branch:
        description: Update branch (must match the build's channel)
        required: true
        default: production
        type: choice
        options: [production, preview, development]

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPO_PUBLIC_SUPABASE_URL: https://atdusjfidswqrkuefgvr.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mu_kqNJaYm95Gp1aaiK-oQ_in0SPlUw

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # An OTA update ships straight to real devices with no review step, so the
      # typecheck is the only gate between a mistake and everyone's phone.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Publish update
        run: eas update --branch "${{ inputs.branch }}" --message "${{ inputs.message }}" --non-interactive
