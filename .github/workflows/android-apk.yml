name: Build Android APK

# Ubuntu runners ship the Android SDK and JDK 17 already, and Actions minutes are
# free on a public repo — so this avoids both the EAS free-tier build quota and
# the local Windows toolchain entirely.
on:
  workflow_dispatch: # build on demand from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design/**'
      - 'docs/**'

# Three pushes in a minute previously left three 25-minute Gradle builds fighting
# for the same runners; two were killed mid-build. Now the newest push wins and
# older runs are cancelled deliberately rather than dying at random.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# Creating the "latest" release needs write access to repository contents.
# The default GITHUB_TOKEN is read-only on this repo.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Public by design: the anon key is meant to ship inside the app, and RLS is
      # what protects the data. The YouTube key and Spotify secret are NOT here —
      # those are Edge Function secrets and never reach the client bundle.
      EXPO_PUBLIC_SUPABASE_URL: https://atdusjfidswqrkuefgvr.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mu_kqNJaYm95Gp1aaiK-oQ_in0SPlUw

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Every build used to report versionCode 1, which left the app no way to
      # tell one build from another — so the in-app updater had nothing to
      # compare and Android saw no build as newer than any other.
      #
      # The run number is monotonic per workflow, which is exactly the property
      # versionCode needs. Written into app.json BEFORE prebuild, because
      # prebuild is what generates the Gradle config that carries it. The edit
      # is never committed; it exists only for this run.
      - name: Stamp the build number
        id: stamp
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android = app.expo.android ?? {};
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "versionCode=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Stamped versionCode $GITHUB_RUN_NUMBER"

      # Generates android/ from app.json. Not committed — it is regenerated every
      # run, so app.json stays the single source of truth for native config.
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # android/ is generated by prebuild, so these cannot live in the repo —
      # they have to be applied to each fresh copy.
      #
      # Metaspace: the default 512m is not enough once expo-updates is in the
      # build; its Kotlin annotation processor dies with OutOfMemoryError:
      # Metaspace partway through. Runners have 16 GB, so this is free headroom.
      #
      # Architectures: the default builds React Native's C++ core for all four
      # ABIs, which was the whole 20-minute native step. x86/x86_64 are emulator
      # only and armeabi-v7a is pre-2017 devices; arm64-v8a covers every real
      # phone. Add others back here if an emulator build is ever needed.
      - name: Tune Gradle memory and target one architecture
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m"
            echo "reactNativeArchitectures=arm64-v8a"
          } >> android/gradle.properties
          tail -3 android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK by commit
        id: rename
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$SRC" || { echo "no APK produced"; exit 1; }
          OUT="aux-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: aux-apk
          path: ${{ steps.rename.outputs.path }}
          retention-days: 30

      # A single permanent link that always points at the newest build.
      #
      # Artifacts are per-run: every run yields its own page and its own file,
      # and a browser that already holds aux-<oldsha>.apk will happily download
      # it again as aux-<oldsha>(1).apk from a *different* run's page. That is
      # how an old build gets installed while the newest one sits untouched.
      # The "latest" release replaces its asset in place, so the download link
      # never changes and the file on disk is always current.
      # A MANUAL DISPATCH PUBLISHES TOO, and not only pushes to main.
      #
      # Without this a branch build produced an Actions artifact and nothing
      # else: a zip, behind a GitHub login, on a per-run page. Getting that onto
      # a phone means signing in on the phone, downloading, extracting, then
      # installing — which is exactly the friction the "latest" release exists to
      # remove, and it also leaves the in-app updater blind, because it reads
      # build-info.json from this release and a branch build never wrote one.
      #
      # A manual dispatch is deliberate by definition, so it is a safe thing to
      # gate on. The cost is real and worth stating: while a branch build is the
      # newest dispatch, "latest" points at that branch rather than at main, and
      # every installed app will offer it as an update. Push main again to put
      # it back.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The download filename is the ON-DISK name; gh's `file#label` only
          # changes the label shown on the page. Copy to a stable name so the
          # file that lands in Downloads is always aux-latest.apk and simply
          # overwrites the previous one.
          cp "${{ steps.rename.outputs.path }}" aux-latest.apk

          # What the in-app updater reads to decide whether a newer build
          # exists. Published as a release ASSET rather than read through the
          # API, because unauthenticated API calls are capped at 60/hour per IP
          # and asset downloads are not — a phone checking for updates must
          # never be rate-limited into thinking it is current.
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
            fs.writeFileSync('build-info.json', JSON.stringify({
              versionCode: Number(process.env.GITHUB_RUN_NUMBER),
              versionName: app.version,
              patch: app.extra?.patch ?? 0,
              commit: (process.env.GITHUB_SHA ?? '').slice(0, 7),
              builtAt: new Date().toISOString(),
              apk: 'aux-latest.apk',
              sizeBytes: fs.statSync('aux-latest.apk').size,
              notes: app.extra?.changelog?.[0]?.notes ?? [],
            }, null, 2) + '\n');
          "
          cat build-info.json

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest             --title "aux — latest build"             --notes "Built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC').

          Install this one. It is replaced by every push to main and by every
          manual build, so this link is always the newest one published.

          The branch is named above deliberately: a manually dispatched build can
          come from somewhere other than main, and you should be able to tell
          what is on your phone without digging through Actions.

          **Delete any older aux-*.apk from your phone's Downloads first** —
          Android keeps both and it is easy to install the wrong file."             aux-latest.apk build-info.json
