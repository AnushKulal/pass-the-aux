<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #57E2D5; } a:hover { color: #8bede4; }
    .aux-tap { cursor: pointer; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; background: #0E0A16; color: #F2EDF7; font-family: Figtree, system-ui, sans-serif; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 28px;">

  <!-- Two seconds of screen. Almost nothing on it. -->
  <div style="position: absolute; left: 50%; top: 176px; transform: translateX(-50%); width: 420px; height: 340px; background: radial-gradient(circle, rgba(199,127,168,.18) 0%, rgba(139,95,176,.10) 45%, rgba(14,10,22,0) 72%); filter: blur(34px); pointer-events: none;"></div>

  <!-- Connecting -->
  <sc-if value="{{ isConnecting }}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px;">
      <div style="width: 96px; height: 96px; border-radius: 50%; border: 1px solid rgba(232,177,92,.16); display: grid; place-items: center;">
        <div style="width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(232,177,92,.30); display: grid; place-items: center;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background: #E8B15C; box-shadow: 0 0 16px rgba(232,177,92,.55);"></div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.2; text-align: center;">Connecting Spotify…</div>
        <div style="font-size: 16px; line-height: 1.5; color: #A79FB8; text-align: center; max-width: 270px;">Handing your sign-in back to Aux.</div>
      </div>
    </div>
  </sc-if>

  <!-- Connected. A confirmation is not a live state, so it stays warm white. -->
  <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px;">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2EDF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.2; text-align: center;">Spotify connected</div>
        <div style="padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.10);">
          <span style="font-size: 13.5px; line-height: 1.4; color: #A79FB8;">Connected &middot; Premium</span>
        </div>
        <div style="font-size: 16px; line-height: 1.5; color: #A79FB8; text-align: center; max-width: 290px;">Sessions play through the Spotify app on this device. Keep Spotify installed and signed in, and leave it open when you take the aux.</div>
      </div>
    </div>
  </sc-if>

  <!-- Failed -->
  <sc-if value="{{ isFailed }}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px;">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: rgba(242,101,126,.07); border: 1px solid rgba(242,101,126,.26); display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2657E" stroke-width="1.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.2; text-align: center;">Could not connect Spotify</div>
        <div style="font-size: 16px; line-height: 1.5; color: #A79FB8; text-align: center; max-width: 270px;">Spotify access was declined.</div>
      </div>
      <div onClick="{{ retry }}" class="aux-tap" style="min-height: 52px; padding: 0 26px; border-radius: 999px; background: #F2EDF7; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 16px; font-weight: 600; color: #0E0A16;">Try again</span>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{"state":{"editor":"enum","options":["connecting","success","failed"],"default":"connecting","section":"Prototype"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { retrying: false };
  }

  renderVals() {
    // Try again puts the screen back into its working state.
    const state = this.state.retrying ? 'connecting' : (this.props.state ?? 'connecting');

    return {
      isConnecting: state === 'connecting',
      isSuccess: state === 'success',
      isFailed: state === 'failed',
      retry: () => this.setState({ retrying: true }),
    };
  }
}
</script>
</body>
</html>
