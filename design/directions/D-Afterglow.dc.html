<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E8A0BF; } a:hover { color: #f0badd; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; background: #140F1B; color: #F5EFE9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 50%; top: 132px; transform: translateX(-50%); width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(232,160,191,.42) 0%, rgba(146,94,180,.24) 42%, rgba(20,15,27,0) 70%); filter: blur(28px);"></div>

  <div style="position: relative; padding: 22px 22px 0; display: flex; align-items: center; justify-content: space-between;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="rgba(245,239,233,.6)" stroke-width="1.6" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span style="font-size: 12.5px; color: rgba(245,239,233,.62); letter-spacing: 0.03em;">Basement FM</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #7BE8A8;"></span>
      <span style="font-size: 11.5px; color: #7BE8A8;">5</span>
    </div>
  </div>

  <div style="position: relative; padding: 40px 44px 0;">
    <div style="width: 100%; aspect-ratio: 1; border-radius: 22px; background: linear-gradient(150deg, #C77FA8 0%, #8B5FB0 46%, #4A3670 100%); box-shadow: 0 26px 70px rgba(200,120,170,.32), 0 2px 0 rgba(255,255,255,.14) inset;"></div>
  </div>

  <div style="position: relative; padding: 30px 30px 0; text-align: center;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 33px; line-height: 1.18; letter-spacing: -0.005em;">Midnight City</div>
    <div style="font-size: 14.5px; color: rgba(245,239,233,.62); margin-top: 7px;">M83</div>
  </div>

  <div style="position: relative; padding: 26px 30px 0;">
    <div style="height: 3px; border-radius: 2px; background: rgba(245,239,233,.16); position: relative;">
      <div style="position: absolute; inset: 0 57% 0 0; background: #F5EFE9; border-radius: 2px;"></div>
      <div style="position: absolute; left: 43%; top: 50%; transform: translate(-50%,-50%); width: 9px; height: 9px; border-radius: 50%; background: #F5EFE9;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 9px; font-size: 11.5px; color: rgba(245,239,233,.45);">
      <span>1:47</span><span>&minus;2:16</span>
    </div>
  </div>

  <div style="position: relative; padding: 22px 30px 0; display: flex; align-items: center; justify-content: center; gap: 34px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="rgba(245,239,233,.55)"><polygon points="19 20 9 12 19 4 19 20"/><rect x="4.5" y="4" width="2" height="16" rx="1"/></svg>
    <div style="width: 66px; height: 66px; border-radius: 50%; background: rgba(245,239,233,.1); backdrop-filter: blur(12px); border: 1px solid rgba(245,239,233,.2); display: grid; place-items: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#F5EFE9"><rect x="6.5" y="4" width="4" height="16" rx="1.4"/><rect x="13.5" y="4" width="4" height="16" rx="1.4"/></svg>
    </div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#F5EFE9"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17.5" y="4" width="2" height="16" rx="1"/></svg>
  </div>

  <div style="position: relative; padding: 26px 30px 0; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(#E8A0BF,#B06A94); border: 2px solid #140F1B;"></div>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(#8B5FB0,#5A3C7A); border: 2px solid #140F1B; margin-left: -9px;"></div>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(#7BA8E8,#4A6BA0); border: 2px solid #140F1B; margin-left: -9px;"></div>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(245,239,233,.12); border: 2px solid #140F1B; margin-left: -9px; display: grid; place-items: center; font-size: 10.5px; color: rgba(245,239,233,.7);">+2</div>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; padding: 0 22px 22px;">
    <div style="border-radius: 20px 20px 0 0; background: rgba(245,239,233,.07); border: 1px solid rgba(245,239,233,.12); border-bottom: none; padding: 16px 18px 20px;">
      <div style="display: flex; gap: 20px; margin-bottom: 14px;">
        <span style="font-size: 13px; font-weight: 600;">Up next</span>
        <span style="font-size: 13px; color: rgba(245,239,233,.5);">Chat</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(140deg,#8B5FB0,#4A3670); flex: none;"></div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px;">Instant Crush</div>
            <div style="font-size: 11.5px; color: rgba(245,239,233,.5);">Daft Punk &middot; Anush</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 38px; height: 38px; border-radius: 9px; background: linear-gradient(140deg,#C77FA8,#7A4A68); flex: none;"></div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px;">Nightcall</div>
            <div style="font-size: 11.5px; color: rgba(245,239,233,.5);">Kavinsky &middot; Tara</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
